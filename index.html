<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5.0, user-scalable=yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-title" content="Notoz">
    <meta name="theme-color" content="#000000">
    <title>Notoz - Login/SignUp</title>
    <script>
      (function () {
        try {
          if (window.NotozNativeBridge && typeof window.NotozNativeBridge.getPendingSharedData === 'function') {
            var raw = window.NotozNativeBridge.getPendingSharedData();
            if (raw) {
              sessionStorage.setItem('notoz_pending_share', raw);
            }
          }
          window.onNotozNativeShare = function (data) {
            try {
              sessionStorage.setItem('notoz_pending_share', JSON.stringify(data));
            } catch (e) {}
          };
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && (k.indexOf('-auth-token') !== -1 || k.indexOf('sb-') !== -1)) {
              var v = localStorage.getItem(k);
              if (v && (v.indexOf('"access_token"') !== -1 || v.indexOf('access_token') !== -1)) {
                window.location.replace('./app/index.html');
                return;
              }
            }
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="./capacitor-native.css">
    <link rel="stylesheet" href="./src/css/login.css">
    <link rel="stylesheet" href="./app/src/css/hfr-motion.css">
    <link rel="manifest" href="./manifest.json">    
    <link rel="icon" type="image/png" href="./app/src/assets/icons/logo.png">
    <link rel="apple-touch-icon" href="./app/src/assets/icons/logo.png">
    <link rel="preconnect" href="./app/src/assets/fonts/SFR.ttf"> 
    <script src="./vendor/supabase.min.js"></script>
</head>
<body>

    <header class="top-nav">
        <span> Notoz</span>
    </header>

    <main class="auth-container">
        <section id="login-section" class="auth-card">
            <div class="app-branding">
                <img src="./app/src/assets/icons/logo.png" alt="Notoz Logo" class="app-logo">
            </div>
            <h2>Sign in with Notoz Account</h2>
            <form id="login-form">
                <div class="input-stack">
                    <input type="email" id="login-email" placeholder="Email Address" required autocomplete="username">
                    <div id="password-group" class="password-group">
                        <div class="password-input-wrap">
                            <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
                            <button type="button" class="password-toggle" data-password-toggle aria-controls="login-password" aria-label="Show password" aria-pressed="false">
                                <svg class="password-toggle-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                    <path d="M2.25 12c1.65-3.28 5.29-6 9.75-6s8.1 2.72 9.75 6c-1.65 3.28-5.29 6-9.75 6S3.9 15.28 2.25 12Z"></path>
                                    <circle cx="12" cy="12" r="2.5"></circle>
                                    <path class="password-eye-slash" d="M4 4l16 16"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
                <button type="submit" id="login-btn">Continue</button>
            </form>
            <div class="card-links">
                <a href="#" id="show-signup">Create Your Notoz Account</a>
            </div>
        </section>

        <section id="signup-section" class="auth-card" style="display: none;">
            <div class="app-branding">
                <img src="./app/src/assets/icons/logo.png" alt="Notoz Logo" class="app-logo">
            </div>
            <h2>Create Your Notoz ID</h2>
            <form id="signup-form">
                <div class="input-stack">
                    <input type="text" id="signup-display-name" placeholder="Name" required>
                    <input type="email" id="signup-email" placeholder="Email" required>
                    <div class="password-input-wrap">
                        <input type="password" id="signup-password" placeholder="Password (8+ chars)" required>
                        <button type="button" class="password-toggle" data-password-toggle aria-controls="signup-password" aria-label="Show password" aria-pressed="false">
                            <svg class="password-toggle-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path d="M2.25 12c1.65-3.28 5.29-6 9.75-6s8.1 2.72 9.75 6c-1.65 3.28-5.29 6-9.75 6S3.9 15.28 2.25 12Z"></path>
                                <circle cx="12" cy="12" r="2.5"></circle>
                                <path class="password-eye-slash" d="M4 4l16 16"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit">Sign Up</button>
            </form>
            <div class="card-links">
                <a href="#" id="show-login">Already have an Account? Sign In</a>
            </div>
        </section>

        <div id="auth-message" role="status" aria-live="polite"></div>
    </main>

    <footer class="legal-footer">
        <div class="footer-content">
            <div class="footer-links">
                <a href="./app/src/pages/privacy.html">Privacy</a>
                <a href="./app/src/pages/tos.html">Terms</a>
                <a href="./app/src/pages/about.html">About</a>
            </div>
            <p>&copy; 2026 Notoz. All rights reserved.</p>
        </div>
    </footer>
    <script src="./src/js/login.js"></script>
    <script src="./app/src/js/security-monitor.js"></script>
    <script src="./capacitor-bridge.js"></script>
    <script src="./app/src/js/dev-logs.js"></script>
    <script src="./app/src/js/hfr-motion.js"></script>
    <script src="./app/src/js/hfr-components.js"></script>
</body>
</html>
