name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ota:
    # plain push to main -> web-only OTA bundle
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install

      # Version = your SW cache version, bumped however you already do it.
      # Here: read it straight from sw.js so there's one source of truth.
      - name: Read version
        id: v
        run: |
          V=$(grep -oP "notoj-app-v\K[0-9.]+" sw.js | head -1)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # Copy web assets to www and build OTA bundle
      - run: npm run copy-web
      - run: node scripts/make-ota.mjs www ${{ steps.v.outputs.version }} https://github.com/${{ github.repository }}/releases/download/ota

      - name: Read checksum
        id: meta
        run: |
          CHECKSUM=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("ota-out/latest.json")).checksum || "")')
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

      # Rolling "ota" release holds the latest zip + latest.json.
      # latest.json URL: https://github.com/<you>/<repo>/releases/download/ota/latest.json
      - name: Publish OTA release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ota
          name: OTA (rolling) - v${{ steps.v.outputs.version }}
          body: |
            {"version":"${{ steps.v.outputs.version }}","native":"1","checksum":"${{ steps.meta.outputs.checksum }}","url":"https://github.com/${{ github.repository }}/releases/download/ota/notoz-${{ steps.v.outputs.version }}.zip"}
          files: ota-out/*
          draft: false
          prerelease: false
          make_latest: false

  apk:
    # tag v* -> full native build (plugin / permission / Capacitor changes)
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Sync Capacitor Android
        run: |
          npm run copy-web
          npx cap sync android

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
          fi

      # Build both Debug and Release APKs so app-debug.apk is always available
      - name: Build APKs (Debug & Release)
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_name }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          if [ -f "app/release.jks" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace || true
          fi

      - name: Publish Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          name: Notoz ${{ github.ref_name }} - Hotfix & Maintenance Release
          body: |
            ## 🚀 Project Scorpio (Notoz) ${{ github.ref_name }}

            This release resolves the OTA download checksum requirement:

            ### 🐛 Issues Resolved:
            - **Checksum Requirement for Capgo Updater**: Computed SHA-256 checksum during bundle creation and passed it directly to Capgo's download plugin to prevent `Checksum required` download failures.
            - **OTA Check API Discovery**: Uses GitHub API directly with zero 302 redirects and full CORS support.
            - **Modal Timeout Protection**: Guaranteed that update checks cannot freeze on "Checking...".

            ### 📦 Binaries Included:
            - `app-debug.apk`: Pre-built APK for immediate installation on any Android device.
            - `app-release.apk`: Production signed release APK.
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: false
